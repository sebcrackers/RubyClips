<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADCASH OS // PUBLISHER TERMINAL v2.4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a; --text-primary: #e0e0e0; --text-bright: #ffffff;
            --text-dim: #808080; --accent-cyan: #00ffff; --accent-green: #00ff00;
            --accent-red: #ff0000; --border-color: #e0e0e0;
            --terminal-glow: 0 0 5px rgba(255, 255, 255, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-primary); font-family: 'Share Tech Mono', monospace; min-height: 100vh; overflow-x: hidden; }
        body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; z-index: 9999; pointer-events: none; opacity: 0.8; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        header { grid-column: 1 / -1; border: 2px solid var(--border-color); padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; box-shadow: var(--terminal-glow); }
        h1 { font-family: 'VT323', monospace; font-size: 2.5rem; color: var(--text-bright); text-shadow: var(--terminal-glow); letter-spacing: 2px; }
        .status-bar { font-size: 1.2rem; color: var(--accent-cyan); }
        .panel { border: 1px solid var(--border-color); padding: 20px; background: rgba(20, 20, 20, 0.6); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .panel h2 { font-family: 'VT323', monospace; font-size: 1.8rem; color: var(--text-bright); border-bottom: 1px solid var(--text-dim); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .left-panel { display: flex; flex-direction: column; }
        .log-output { font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; height: 450px; overflow-y: auto; line-height: 1.4; color: var(--accent-green); }
        .log-output::-webkit-scrollbar { width: 8px; } .log-output::-webkit-scrollbar-track { background: #111; } .log-output::-webkit-scrollbar-thumb { background: #444; }
        .right-panel { display: flex; flex-direction: column; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { border: 1px solid var(--text-dim); padding: 15px; text-align: center; background: rgba(0,0,0,0.3); }
        .stat-label { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-family: 'VT323', monospace; font-size: 2rem; color: var(--text-bright); text-shadow: var(--terminal-glow); }
        .chart-container { border: 1px solid var(--text-dim); padding: 15px; height: 300px; margin-bottom: 20px; background: rgba(0,0,0,0.2); }
        .table-container { border: 1px solid var(--text-dim); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px dashed var(--text-dim); }
        th { color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background-color: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ADCASH OS // PUBLISHER TERMINAL v2.4</h1>
            <div class="status-bar" id="status-bar">STATUS: INITIALIZING...</div>
        </header>

        <div class="left-panel panel">
            <h2>SYSTEM LOG <span style="color: var(--accent-green)">●</span></h2>
            <div class="log-output" id="log-output"></div>
        </div>

        <div class="right-panel">
            <div class="panel" style="margin-bottom: 20px;">
                <h2>ACCOUNT OVERVIEW</h2>
                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">Account Balance</div><div class="stat-value" id="stat-balance">--</div></div>
                    <div class="stat-box"><div class="stat-label">Total Earnings (7d)</div><div class="stat-value" id="stat-earnings">--</div></div>
                    <div class="stat-box"><div class="stat-label">Unique Users (7d)</div><div class="stat-value" id="stat-uniques">--</div></div>
                    <div class="stat-box"><div class="stat-label">Clicks (7d)</div><div class="stat-value" id="stat-clicks">--</div></div>
                </div>
            </div>

            <div class="panel" style="margin-bottom: 20px;">
                <h2>EARNINGS GRAPH (LAST 7 DAYS)</h2>
                <div class="chart-container"><canvas id="earningsChart"></canvas></div>
            </div>

            <div class="panel">
                <h2>ZONE BREAKDOWN DATA</h2>
                <div class="table-container">
                    <table id="data-table">
                        <thead>
                            <tr><th>Zone ID</th><th>Earnings</th><th>Unique Users</th><th>Clicks</th><th>Unique eCPM</th></tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_KEY = "/SuprblgeDs0cPCjI37aZ5o1ROynI6uWOvKNWdC5SOPsspiRISSpIplcGbRPizxS5SXJeMU7X6994CQyQCFX5XMYk62d6DJSDsOBqDpkmmvyl1fNDfBhYpqBXV56WM22E/M5F31dFjR0+y8RV8hrXQ==";
        const PROXY_URL = "proxy.php?endpoint=";

        // --- DOM ELEMENTS ---
        const logOutput = document.getElementById('log-output');
        const statusBar = document.getElementById('status-bar');
        const statBalance = document.getElementById('stat-balance');
        const statEarnings = document.getElementById('stat-earnings');
        const statUniques = document.getElementById('stat-uniques');
        const statClicks = document.getElementById('stat-clicks');
        const tableBody = document.getElementById('table-body');

        // --- HELPER FUNCTIONS ---
        function logMessage(msg, color = 'var(--accent-green)') {
            const p = document.createElement('div');
            p.style.color = color;
            p.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
            logOutput.appendChild(p);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function setStatus(status, color = 'var(--accent-cyan)') {
            statusBar.innerHTML = `STATUS: ${status}`;
            statusBar.style.color = color;
        }

        // --- API FUNCTIONS ---
        async function authenticate() {
            logMessage("INITIATING AUTHENTICATION SEQUENCE...");
            const targetUrl = `${PROXY_URL}/auth/token`;
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ api_token: API_KEY })
            });

            // Read as text first to prevent "Unexpected end of JSON input" crashes
            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                throw new Error(`Server returned invalid JSON. Response was: "${text.substring(0, 100)}"`);
            }
            
            if (!response.ok || !data.data || !data.data.access_token) {
                throw new Error(data.error?.message || `Auth Failed: HTTP ${response.status}`);
            }
            
            logMessage("AUTHENTICATION SUCCESSFUL. TOKEN ACQUIRED.", 'var(--accent-cyan)');
            return data.data.access_token;
        }

        async function getBalance(token) {
            logMessage("FETCHING ACCOUNT BALANCE...");
            const response = await fetch(`${PROXY_URL}/publishers/balance`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch (e) { throw new Error(`Balance parse error: "${text.substring(0, 100)}"`); }
            if (!response.ok) throw new Error(data.error?.message || `Balance Failed: HTTP ${response.status}`);
            return data.data;
        }

        async function getReports(token) {
            logMessage("FETCHING 7-DAY REPORTING DATA...");
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const formatDate = (d) => d.toISOString().split('T')[0];
            
            const startDate = formatDate(weekAgo);
            const endDate = formatDate(today);
            
            const response = await fetch(`${PROXY_URL}/publishers/reports?start_date=${startDate}&end_date=${endDate}&group_by=date,zone`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch (e) { throw new Error(`Reports parse error: "${text.substring(0, 100)}"`); }
            if (!response.ok) throw new Error(data.error?.message || `Reports Failed: HTTP ${response.status}`);
            return data.data.rows;
        }

        // --- RENDER FUNCTIONS ---
        function renderUI(balanceData, reportsData) {
            statBalance.innerHTML = `${balanceData.balance.toFixed(2)} ${balanceData.currency}`;
            
            let totalEarnings = 0, totalUniques = 0, totalClicks = 0;
            const chartData = {};
            const zoneData = {};

            reportsData.forEach(row => {
                totalEarnings += parseFloat(row.earnings);
                totalUniques += row.unique_users;
                totalClicks += row.clicks;

                const dateKey = row.date || "Unknown Date";
                if (!chartData[dateKey]) chartData[dateKey] = 0;
                chartData[dateKey] += parseFloat(row.earnings);

                if (!zoneData[row.zone]) {
                    zoneData[row.zone] = { earnings: 0, uniques: 0, clicks: 0, ecpm: row.unique_users_ecpm };
                }
                zoneData[row.zone].earnings += parseFloat(row.earnings);
                zoneData[row.zone].uniques += row.unique_users;
                zoneData[row.zone].clicks += row.clicks;
            });

            statEarnings.innerHTML = `${totalEarnings.toFixed(2)} ${balanceData.currency}`;
            statUniques.innerHTML = totalUniques.toLocaleString();
            statClicks.innerHTML = totalClicks.toLocaleString();

            tableBody.innerHTML = "";
            Object.keys(zoneData).forEach(zoneId => {
                const z = zoneData[zoneId];
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${zoneId}</td><td style="color: var(--accent-green)">${z.earnings.toFixed(2)}</td><td>${z.uniques.toLocaleString()}</td><td>${z.clicks}</td><td>${z.ecpm || "N/A"}</td>`;
                tableBody.appendChild(tr);
            });

            renderChart(chartData, balanceData.currency);
        }

        function renderChart(chartData, currency) {
            const ctx = document.getElementById('earningsChart').getContext('2d');
            const labels = Object.keys(chartData).sort();
            const dataPoints = labels.map(date => chartData[date]);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Daily Earnings (${currency})`,
                        data: dataPoints,
                        borderColor: '#ffffff',
                        backgroundColor: 'rgba(255, 255, 255, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: '#00ffff',
                        pointBorderColor: '#ffffff',
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e0e0e0', font: { family: "'Share Tech Mono', monospace", size: 14 } } } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#808080', font: { family: "'Share Tech Mono', monospace" } } },
                        x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#808080', font: { family: "'Share Tech Mono', monospace" } } }
                    }
                }
            });
        }

        // --- INITIALIZATION ---
        async function init() {
            logMessage("SYSTEM BOOT...");
            logMessage("LOADING ADCASH PUBLISHER MODULE v2.4...");
            setStatus("AUTHENTICATING...", "var(--accent-cyan)");

            try {
                const token = await authenticate();
                setStatus("AUTHENTICATED", "var(--accent-green)");

                const balance = await getBalance(token);
                logMessage("BALANCE FETCHED. FETCHING REPORTS...", "var(--accent-cyan)");

                const reports = await getReports(token);

                logMessage("DATA RETRIEVED. RENDERING DASHBOARD...", "var(--text-bright)");
                renderUI(balance, reports);
                setStatus("DATA SYNCED", "var(--accent-green)");
                logMessage("DASHBOARD ACTIVE.", "var(--text-bright)");

            } catch (error) {
                console.error("DASHBOARD ERROR:", error);
                logMessage(`FATAL ERROR: ${error.message}`, "var(--accent-red)");
                setStatus("API ERROR", "var(--accent-red)");
            }
        }

        init();
    </script>
</body>
</html>
